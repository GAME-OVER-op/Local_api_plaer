plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tabletplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.tabletplayer"
        minSdk 19
        targetSdk 22
        versionCode 5
        versionName "4.1"
        ndk { abiFilters 'armeabi-v7a' }
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release {
            // R8 оптимизирует только bytecode. Исходные ресурсы и их набор не меняем.
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Сам Gradle работает на JDK 17, приложению достаточно Java 8.
        // Это не даёт случайно использовать API Java, отсутствующие на Android 4.4.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
        aidl false
        renderScript false
        dataBinding false
        viewBinding false
    }

    lint {
        // Lint выполняется для release и создаёт отчёт, но намеренные legacy-API
        // Android 4.4 не блокируют выпуск до их точечной классификации.
        abortOnError false
        checkReleaseBuilds true
        htmlReport true
        textReport true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.media:media:1.4.3'
    implementation 'org.videolan.android:libvlc-all:3.5.1'
}


tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = true
}
